[package]
name = "cad2bem"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "STEP/IGES to BEM surface geometry: free and structured panels (HBG/GDF/STL) and exact spline patches (HBG)"
# examples/ holds CAD models, not Cargo examples.
autoexamples = false

[features]
# Link Gmsh and OpenCASCADE statically (scripts/build_static_cad.ps1); otherwise a Gmsh SDK is loaded at run time.
static-gmsh = []

[[example]]
name = "static_cad_probe"
path = "scripts/static_cad_probe.rs"
required-features = ["static-gmsh"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
ctrlc = "=3.5.2"
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "x11", "wayland"] }
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.8"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
# Not imported (eframe re-exports it): picks the graphics backends eframe uses.
wgpu = { version = "27", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }

[build-dependencies]
# The licence files the executable carries (build/licenses.rs reads cargo metadata).
serde_json = "1"

[profile.dev]
debug = 1
# The engine does heavy numerics: optimize debug builds too, so tests stay fast.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
